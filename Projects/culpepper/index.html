<!DOCTYPE html>
<html lang="en">
<head>
  <title>Culpepper</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../../css/workPage__NEW.css">
  <style>
    /* ===== Section spacing — adjust top/bottom padding here only ===== */
    #gallery-1 { --gallery-top-spacing: 4.5rem; --gallery-bottom-spacing: 0; }
    #tv-frame-1 { --tv-frame-top-spacing: 0rem; --tv-frame-bottom-spacing: 0; }
    #gallery-2 { --gallery-top-spacing: 0; --gallery-bottom-spacing: 0; }
  </style>
</head>
<body>

  <header class="header header--overlay">
    <nav class="navbar">
      <a href="../../index.html" class="nav-s-button">Shreyanshi Satodia</a>
      <ul class="nav-links">
        <li><a href="../../aboutme/" class="nav-regular-link">About Me</a></li>
        <li><a href="../../index.html#grid-container" class="nav-regular-link">Work</a></li>
        <li><a href="../../ShreyanshiSatodia.Resume.pdf" target="_blank" class="nav-regular-link">Resume</a></li>
      </ul>
    </nav>
  </header>

  <div class="header-image">
    <img src="../../project_images/Culpepper/header_image_cullpepper.png" alt="Culpepper header">
  </div>

  <div class="gallery" id="gallery-1">
    <img src="../../project_images/Culpepper/gallery_image_culpepper_1.webp" alt="Culpepper design">
  </div>

  <div class="tv-frame" id="tv-frame-1">
    <img class="tv-frame__base" src="../../project_images/Culpepper/tv_frame_cutout.png" alt="">
    <div class="tv-frame__screen">
      <video src="../../project_images/Culpepper/tv_frame_content.mp4" autoplay muted loop playsinline></video>
    </div>
  </div>

  <div class="gallery" id="gallery-2">
    <img src="../../project_images/Culpepper/gallery_image_culpepper_2.webp" alt="Culpepper design">
  </div>

  <!-- Footer Bar -->
  <div class="footer-bar">
    <a href="../hg/" class="arrow-link left-arrow"><span class="arrow-symbol">&#8249;</span> HG</a>
    <a href="../swire-water/" class="arrow-link right-arrow">Swire Water <span class="arrow-symbol">&#8250;</span></a>
  </div>

  <!-- Transition Script -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      document.querySelectorAll('a.arrow-link').forEach(link => {
        link.addEventListener('click', function(e) {
          e.preventDefault();
          const isPrev = link.classList.contains('left-arrow');
          const href = link.href;
          sessionStorage.setItem('slideDir', isPrev ? 'left' : 'right');
          document.body.classList.add(isPrev ? 'slide-out-right' : 'slide-out-left');
          setTimeout(function() {
            window.location = href;
          }, 300);
        });
      });

      const dir = sessionStorage.getItem('slideDir');
      if (dir) {
        if (dir === 'left') {
          document.body.classList.add('slide-in-from-left');
        } else {
          document.body.classList.add('slide-in-from-right');
        }
        requestAnimationFrame(() => {
          document.body.classList.add('slide-in-active');
          sessionStorage.removeItem('slideDir');
        });
      }
    });
  </script>

</body>
</html>
