  <style>
    /* ===== Section spacing — adjust top/bottom padding here only ===== */
    #gallery-1 { --gallery-top-spacing: 0rem; --gallery-bottom-spacing: 2rem; border-bottom: 1px solid #000; }

    /* ===== Hero geometry =====
       Both layers are positioned as percentages of the hero artwork
       (lwl_hero_base.webp, 3517x2039 before export).

       Screen: the tablet's screen was cut out of the artwork at
       x 220-2288, y 257-1819 (rounded corners, r56), which is
       6.255% / 12.604% / 58.829% / 76.655%. The numbers below bleed that
       box out by 0.6% on each side so the pinned loop always runs under
       the bezel instead of stopping a hair short of it.

       Phones: measured off the approved mockup -- the overlay's artwork
       lands at 56.50% / 29.64% and spans 41.56% of the hero width. */
    #lwl-hero {
      --pinned-screen-left: 5.902%;
      --pinned-screen-top: 12.144%;
      --pinned-screen-width: 59.535%;
      --pinned-screen-height: 77.575%;

      --pinned-layer-left: 56.50%;
      --pinned-layer-top: 29.64%;
      --pinned-layer-width: 41.56%;

      /* Fit the whole hero in the first screen: never taller than the
         viewport, so width is capped at (viewport height x artwork
         aspect) and the hero centres. The artwork's own white / lime
         backdrop is continued edge-to-edge by the wrapper below, so the
         shrunk hero still looks full-bleed. */
      width: min(100%, calc(100svh * 3517 / 2039));
      margin: 0 auto;
    }
    /* White above, lime below -- the split sits at 46.24% of the
       artwork's height, which is where the artwork's own lime begins. */
    #lwl-hero-wrap {
      background: linear-gradient(to bottom, #fff 0, #fff var(--lwl-split, 46.24%), #d7e155 var(--lwl-split, 46.24%), #d7e155 100%);
    }
  </style>

<!-- Footer Bar -->

  </div>

  <!-- Transition Script -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      document.querySelectorAll('a.arrow-link').forEach(link => {
        link.addEventListener('click', function(e) {
          e.preventDefault();
          const isPrev = link.classList.contains('left-arrow');
          const href = link.href;
          sessionStorage.setItem('slideDir', isPrev ? 'left' : 'right');
          document.body.classList.add(isPrev ? 'slide-out-right' : 'slide-out-left');
          setTimeout(function() {
            window.location = href;
          }, 300);
        });
      });

      const dir = sessionStorage.getItem('slideDir');
      if (dir) {
        if (dir === 'left') {
          document.body.classList.add('slide-in-from-left');
        } else {
          document.body.classList.add('slide-in-from-right');
        }
        requestAnimationFrame(() => {
          document.body.classList.add('slide-in-active');
          sessionStorage.removeItem('slideDir');
        });
      }
    });
  </script>

  <script src="../../js/cursor-glass.js"></script>
